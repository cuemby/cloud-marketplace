apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-groovy
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: app
data:
  01-create-admin.groovy: |
    import jenkins.model.*
    import hudson.security.*

    def instance = Jenkins.getInstance()
    def password = System.getenv("JENKINS_ADMIN_PASSWORD")

    if (password && !password.isEmpty()) {
        def hudsonRealm = new HudsonPrivateSecurityRealm(false)
        hudsonRealm.createAccount("admin", password)
        instance.setSecurityRealm(hudsonRealm)

        def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
        strategy.setAllowAnonymousRead(false)
        instance.setAuthorizationStrategy(strategy)

        instance.save()
        println("[init] Admin user created successfully.")
    } else {
        println("[init] JENKINS_ADMIN_PASSWORD not set — skipping admin creation.")
    }
  02-set-url.groovy: |
    import jenkins.model.*

    def url = System.getenv("JENKINS_URL_EXTERNAL")
    if (url && !url.isEmpty()) {
        def jlc = JenkinsLocationConfiguration.get()
        jlc.setUrl(url)
        jlc.save()
        println("[init] Jenkins URL set to: ${url}")
    }
