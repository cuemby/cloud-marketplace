apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: app
    spec:
      initContainers:
        - name: install-plugins
          image: docker.io/jenkins/jenkins:${PARAM_APP_IMAGE_TAG}
          command:
            - jenkins-plugin-cli
            - --plugin-file
            - /plugins/plugins.txt
            - --plugin-download-directory
            - /var/jenkins_home/plugins
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: plugins-list
              mountPath: /plugins
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      containers:
        - name: jenkins
          image: docker.io/jenkins/jenkins:${PARAM_APP_IMAGE_TAG}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: agent
              containerPort: 50000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jenkins-config
          env:
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-admin-secret
                  key: JENKINS_ADMIN_PASSWORD
            - name: JENKINS_URL_EXTERNAL
              value: "${PARAM_JENKINS_URL}"
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: init-groovy
              mountPath: /var/jenkins_home/init.groovy.d
              readOnly: true
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: ${PARAM_JENKINS_CPU_REQUEST}
              memory: ${PARAM_JENKINS_MEMORY_REQUEST}
            limits:
              cpu: ${PARAM_JENKINS_CPU_LIMIT}
              memory: ${PARAM_JENKINS_MEMORY_LIMIT}
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data
        - name: init-groovy
          configMap:
            name: jenkins-init-groovy
        - name: plugins-list
          configMap:
            name: jenkins-plugins
