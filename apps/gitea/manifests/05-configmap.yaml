apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: app
data:
  GITEA__database__DB_TYPE: "sqlite3"
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__SSH_PORT: "22"
  GITEA__server__DOMAIN: "${PARAM_GITEA_DOMAIN}"
  GITEA__server__ROOT_URL: "${PARAM_GITEA_ROOT_URL}"
  USER_UID: "1000"
  USER_GID: "1000"
