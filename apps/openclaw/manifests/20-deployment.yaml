apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/openclaw.json ]; then
                printf '{"gateway":{"mode":"local","auth":{"mode":"token"},"controlUi":{"dangerouslyDisableDeviceAuth":true},"trustedProxies":["10.42.0.0/16"]},"commands":{"restart":false},"channels":{"whatsapp":{},"telegram":{},"discord":{},"slack":{}}}\n' > /data/openclaw.json
              fi
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
      containers:
        - name: openclaw
          image: "ghcr.io/openclaw/openclaw:${PARAM_APP_IMAGE_TAG}"
          command:
            - node
            - dist/index.js
            - gateway
            - --bind
            - lan
            - --port
            - "18789"
            - --auth
            - token
            - --token
            - $(OPENCLAW_GATEWAY_TOKEN)
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_OPENAI_API_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_TELEGRAM_TOKEN
                  optional: true
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_DISCORD_TOKEN
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_SLACK_BOT_TOKEN
                  optional: true
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_SLACK_APP_TOKEN
                  optional: true
            # Persist Playwright browser cache on PVC so Chromium survives pod restarts
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/node/.openclaw/.playwright
          envFrom:
            - configMapRef:
                name: openclaw-config
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node/.openclaw
          startupProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: ${PARAM_OPENCLAW_CPU_REQUEST}
              memory: ${PARAM_OPENCLAW_MEMORY_REQUEST}
            limits:
              cpu: ${PARAM_OPENCLAW_CPU_LIMIT}
              memory: ${PARAM_OPENCLAW_MEMORY_LIMIT}

        # CLI sidecar: same image, connects to gateway via localhost:18789.
        # Use: kubectl exec -it <pod> -c openclaw-cli -- openclaw <command>
        - name: openclaw-cli
          image: "ghcr.io/openclaw/openclaw:${PARAM_APP_IMAGE_TAG}"
          command:
            - sleep
            - infinity
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLAW_GATEWAY_URL
              value: "ws://localhost:18789"
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/node/.openclaw/.playwright
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node/.openclaw
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
