apiVersion: v1
kind: Secret
metadata:
  name: openclaw-credentials
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  OPENCLAW_API_KEY: "${PARAM_OPENCLAW_API_KEY}"
  OPENCLAW_GATEWAY_TOKEN: "${PARAM_OPENCLAW_GATEWAY_TOKEN}"
  OPENCLAW_TELEGRAM_TOKEN: "${PARAM_OPENCLAW_TELEGRAM_TOKEN}"
  OPENCLAW_DISCORD_TOKEN: "${PARAM_OPENCLAW_DISCORD_TOKEN}"
  OPENCLAW_SLACK_BOT_TOKEN: "${PARAM_OPENCLAW_SLACK_BOT_TOKEN}"
  OPENCLAW_SLACK_APP_TOKEN: "${PARAM_OPENCLAW_SLACK_APP_TOKEN}"
