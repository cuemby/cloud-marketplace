name: openclaw
displayName: OpenClaw
description: Open-source personal AI assistant that connects to messaging platforms with autonomous capabilities.
category: ai
icon: https://openclaw.ai/favicon.ico

deployMethod: manifest

manifests:
  path: manifests/

ssl:
  enabled: true

requirements:
  cpu: 2
  memory: 4Gi
  disk: 20Gi

versions:
  - appVersion: "2026.2.23"
    imageTag: "2026.2.23"
    default: true
  - appVersion: "2026.2.19"
    imageTag: "2026.2.19"

parameters:
  - name: OPENCLAW_LLM_PROVIDER
    displayName: LLM Provider
    description: LLM provider to use (anthropic or openai)
    type: string
    required: false
    default: "anthropic"

  - name: OPENCLAW_ANTHROPIC_API_KEY
    displayName: Anthropic API Key
    description: Anthropic API key (sk-ant-...). Required when LLM provider is anthropic.
    type: password
    required: false

  - name: OPENCLAW_OPENAI_API_KEY
    displayName: OpenAI API Key
    description: OpenAI API key (sk-...). Required when LLM provider is openai.
    type: password
    required: false

  - name: OPENCLAW_DATA_SIZE
    displayName: Data Storage Size
    description: Size of persistent volume for OpenClaw data (SQLite, memory, transcripts)
    type: string
    required: false
    default: "10Gi"

  - name: OPENCLAW_SSL_ENABLED
    displayName: Enable SSL (HTTPS)
    description: Enable HTTPS access via Let's Encrypt certificate and sslip.io domain
    type: string
    required: false
    default: "true"

  - name: OPENCLAW_HOSTNAME
    displayName: Hostname
    description: Custom hostname for HTTPS access (auto-detected as <IP>.sslip.io if empty)
    type: string
    required: false

  - name: OPENCLAW_ACME_EMAIL
    displayName: Let's Encrypt Email
    description: Email address for Let's Encrypt SSL certificate notifications (required when SSL is enabled)
    type: string
    required: false
    default: "me@cuemby.com"

  - name: OPENCLAW_TELEGRAM_TOKEN
    displayName: Telegram Bot Token
    description: Telegram bot token from @BotFather (optional, configure later from dashboard)
    type: password
    required: false

  - name: OPENCLAW_DISCORD_TOKEN
    displayName: Discord Bot Token
    description: Discord bot token from Discord Developer Portal (optional, configure later from dashboard)
    type: password
    required: false

  - name: OPENCLAW_SLACK_BOT_TOKEN
    displayName: Slack Bot Token
    description: Slack bot token (xoxb-...) from Slack App config (optional, configure later from dashboard)
    type: password
    required: false

  - name: OPENCLAW_SLACK_APP_TOKEN
    displayName: Slack App Token
    description: Slack app-level token (xapp-...) for socket mode (optional, configure later from dashboard)
    type: password
    required: false
