# Route /stats and /healthz through HTTPS Gateway to stats interface.
# Only effective when SSL is enabled (Gateway must exist).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haproxy-stats
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/component: proxy
spec:
  parentRefs:
    - name: app-gateway
      sectionName: websecure
  hostnames:
    - "${PARAM_HAPROXY_HOSTNAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /stats
      backendRefs:
        - name: haproxy-stats-internal
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: haproxy-stats-internal
          port: 80
